name: Create Release

on: # zizmor: ignore[concurrency-limits]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        type: string
      source-ref:
        description: 'Branch to build and tag from'
        required: true
        default: '6.x'
        type: choice
        options:
          - 6.x

permissions: {}

jobs:
  release: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest
    environment: release
    permissions: {} # all writes go through the App token; GITHUB_TOKEN needs no scopes
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Version must match v#.#.# format (got: $VERSION)"
            exit 1
          fi

      - name: Get release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout source ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source-ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] App token is needed to push the tag

      - name: Assert tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --tags origin "$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists on remote. Aborting."
            exit 1
          fi

      - name: Use Node.js 20.19.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: |
          npm run build
          npm run build-dev

      - name: Create the build commit
        env:
          VERSION: ${{ inputs.version }}
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add --force \
            resources/dist \
            resources/dist-dev
          git commit -m "Build assets for $VERSION"

      - name: Tag and push the build commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes
